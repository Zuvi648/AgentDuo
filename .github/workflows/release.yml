# Baut bei einem Tag v* die macOS-App (Apple Silicon) und den Windows-Installer
# und hängt beide an ein GitHub-Release. Unsigniert: Es sind keine Zertifikate hinterlegt.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        if: runner.os == 'macOS'
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-duo-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "Agent Duo $TAG" --generate-notes || true
          gh release upload "$TAG" ${{ matrix.files }} --clobber
